[vars]
python_test_directory = ".github/scripts"
shell_paths = "atvloadly/*.sh macos/*.sh"

# Development
[tasks.build]
description = "Build Active Images For The Local Architecture"
run = "python .github/scripts/image.py build"

[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "test:python",
]

[tasks."check:updates"]
description = "Validate Updatecli Policies & Discovered Pins"
env.GITHUB_TOKEN = "validation-placeholder"
run = '''
set -eu
directory=$(mktemp -d)
trap 'rm -rf -- "$directory"' EXIT
python -B .github/scripts/updates.py "$directory"
updatecli manifest validate --config .updatecli.d --config "$directory" --strict --unique-tmp-dir
'''

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]

# Dependencies
[tasks."dependencies:check"]
description = "Preview Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli Groups"'
run = '''
set -eu
GITHUB_TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}"
export GITHUB_TOKEN
directory=$(mktemp -d)
trap 'rm -rf -- "$directory"' EXIT
python -B .github/scripts/updates.py "$directory"
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline diff --config .updatecli.d --config "$directory" --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
'''

[tasks."dependencies:update"]
description = "Apply Reviewed Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli Groups"'
run = '''
set -eu
GITHUB_TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}"
export GITHUB_TOKEN
directory=$(mktemp -d)
trap 'rm -rf -- "$directory"' EXIT
python -B .github/scripts/updates.py "$directory"
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline apply --config .updatecli.d --config "$directory" --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
'''
