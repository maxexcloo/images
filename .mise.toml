[tools]
actionlint = "1.7.12"
python = "3.15.0"
uv = "0.13.0"

[tasks.build]
description = "Build Active Images For The Local Architecture"
run = "python scripts/image.py build"

[tasks.check]
description = "Validate Workflows, Build Active Images & Test Their Runtimes"
run = """
mise fmt --check
actionlint -shellcheck="" .github/workflows/container.yaml
python scripts/image.py check
"""

[tasks.dev]
description = "Run The Development Checks"
depends = ["check"]

[tasks.fmt]
description = "Format The Mise Configuration"
run = "mise fmt"

[tasks.test]
description = "Test Locally Built Images"
run = "python scripts/image.py test"
