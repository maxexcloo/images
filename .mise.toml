# Development
[tasks.build]
description = "Build Active Images For The Local Architecture"
run = "python .github/scripts/image.py build"

[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "check:whitespace",
  "test:python",
  "test:worker",
]

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]

[tasks."test:worker"]
description = "Test ComfyUI & Radiance Worker Code Without A GPU"
dir = "{{config_root}}/comfyui-radiance"
run = "uv run --no-project --with 'pillow>=13.0.0' python -B -m unittest discover -s tests"
