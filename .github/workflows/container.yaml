name: Container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        default: all
        description: Image recipe to build, or all
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: container-${{ github.ref }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      build-required: ${{ fromJSON(steps.recipes.outputs.matrix).required }}
      matrix: ${{ steps.recipes.outputs.matrix }}
      publish-enabled: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node oxfmt python ruff shellcheck updatecli yq
      - name: Run Checks
        run: mise run check
      - id: recipes
        name: Discover Recipes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image || 'all' }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            current_revision=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$GITHUB_SHA" != "$current_revision" ]; then
              # A skipped push must not become the successful publication baseline.
              if [ "$GITHUB_EVENT_NAME" = push ]; then
                echo '::error::Refusing an outdated push run; main has advanced.'
                exit 1
              fi
              echo '::notice::Skipping an outdated manual run; main has advanced.'
              BASE_REVISION=$GITHUB_SHA
            fi
          fi
          # Pending main runs can be replaced; include every change not yet verified and published.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE_REVISION=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/container.yaml/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          fi
          matrix=$(python3 .github/scripts/image.py matrix "$IMAGE_NAME" --changed-from "$BASE_REVISION")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.recipe.image }} (${{ matrix.architecture }})
    if: needs.prepare.outputs.build-required == 'true'
    needs: prepare
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log In to GHCR
        if: needs.prepare.outputs.publish-enabled == 'true'
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: build
        name: Build & Verify Image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            UPSTREAM_REFERENCE=${{ matrix.recipe.reference }}
            UPSTREAM_REVISION=${{ matrix.recipe.revision }}
          build-contexts: ${{ matrix.recipe.revision && format('upstream=https://github.com/{0}.git#{1}', matrix.recipe.repository, matrix.recipe.revision) || '' }}
          cache-from: type=gha,scope=${{ matrix.recipe.image }}-${{ matrix.architecture }}
          cache-to: ${{ matrix.recipe.image != 'comfyui-rocm' && format('type=gha,mode=max,scope={0}-{1},ignore-error=true', matrix.recipe.image, matrix.architecture) || '' }}
          context: ./${{ matrix.recipe.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ matrix.recipe.repository }}
            ${{ matrix.recipe.reference && format('org.opencontainers.image.version={0}', matrix.recipe.reference) || '' }}
          platforms: linux/${{ matrix.architecture }}
          provenance: ${{ needs.prepare.outputs.publish-enabled == 'true' && 'mode=max' || 'false' }}
          push: ${{ needs.prepare.outputs.publish-enabled == 'true' }}
          sbom: ${{ needs.prepare.outputs.publish-enabled == 'true' }}
          tags: ${{ needs.prepare.outputs.publish-enabled == 'true' && format('ghcr.io/maxexcloo/{0}:sha-{1}-{2}', matrix.recipe.image, github.sha, matrix.architecture) || '' }}
      - name: Record Digest
        if: needs.prepare.outputs.publish-enabled == 'true'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$IMAGE_DIGEST" > "digests/$ARCHITECTURE"
      - name: Upload Digest
        if: needs.prepare.outputs.publish-enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.recipe.image }}-${{ matrix.architecture }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.recipe.image }}
    if: needs.prepare.outputs.publish-enabled == 'true' && needs.prepare.outputs.build-required == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.prepare.outputs.matrix).include }}
    steps:
      - name: Download Digests
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: digests
          pattern: digests-${{ matrix.recipe.image }}-*
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Multi-Architecture Manifest
        env:
          ARCHITECTURES: ${{ join(matrix.recipe.architectures, ' ') }}
          BUILD_REVISION: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/maxexcloo/${{ matrix.recipe.image }}
          UPSTREAM_REVISION: ${{ matrix.recipe.revision }}
          UPSTREAM_VERSION: ${{ matrix.recipe.version }}
        run: |
          set --
          for architecture in $ARCHITECTURES; do
            digest=$(cat "digests/$architecture")
            set -- "$@" "$IMAGE_NAME@$digest"
          done
          if [ -n "$UPSTREAM_REVISION" ]; then
            set -- --tag "$IMAGE_NAME:source-$UPSTREAM_REVISION" "$@"
          fi
          if [ -n "$UPSTREAM_VERSION" ]; then
            set -- --tag "$IMAGE_NAME:$UPSTREAM_VERSION" "$@"
          fi
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:sha-$BUILD_REVISION" \
            "$@"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$BUILD_REVISION"

  check:
    name: Check
    if: always()
    needs: [prepare, build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Build & Publishing Results
        env:
          SUCCESS: >-
            ${{ needs.prepare.result == 'success' &&
                (needs.prepare.outputs.build-required == 'true' || needs.prepare.outputs.build-required == 'false') &&
                needs.build.result == (needs.prepare.outputs.build-required == 'true' && 'success' || 'skipped') &&
                needs.publish.result == (needs.prepare.outputs.build-required == 'true' && needs.prepare.outputs.publish-enabled == 'true' && 'success' || 'skipped') }}
        run: test "$SUCCESS" = true
