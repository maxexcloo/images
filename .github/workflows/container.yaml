name: Container

on:
  workflow_dispatch:
    inputs:
      image:
        default: all
        description: Image recipe to build, or all
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: container-${{ github.ref }}-${{ inputs.image || 'all' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.recipes.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: recipes
        name: Discover Recipes
        env:
          IMAGE_NAME: ${{ inputs.image || 'all' }}
        run: |
          matrix=$(python3 .github/scripts/image.py matrix "$IMAGE_NAME")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.recipe.image }} (${{ matrix.architecture }})
    needs: prepare
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare Space for ROCm
        if: matrix.recipe.image == 'comfyui-rocm'
        run: |
          sudo rm --force --recursive /opt/ghc /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: metadata
        name: Extract Metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/maxexcloo/${{ matrix.recipe.image }}
          labels: |
            org.opencontainers.image.revision=${{ matrix.recipe.revision }}
            org.opencontainers.image.url=https://github.com/${{ matrix.recipe.repository }}
          tags: type=raw,value=sha-${{ github.sha }}-${{ matrix.architecture }}
      - name: Build Image for Verification
        uses: docker/build-push-action@v7
        with:
          build-args: |
            UPSTREAM_REFERENCE=${{ matrix.recipe.reference }}
            UPSTREAM_REVISION=${{ matrix.recipe.revision }}
          build-contexts: upstream=https://github.com/${{ matrix.recipe.repository }}.git#${{ matrix.recipe.revision }}
          cache-from: type=gha,scope=${{ matrix.recipe.image }}-${{ matrix.architecture }}
          cache-to: ${{ matrix.recipe.image != 'comfyui-rocm' && format('type=gha,mode=max,scope={0}-{1},ignore-error=true', matrix.recipe.image, matrix.architecture) || '' }}
          context: ./${{ matrix.recipe.image }}
          labels: ${{ steps.metadata.outputs.labels }}
          load: true
          platforms: linux/${{ matrix.architecture }}
          tags: images-${{ matrix.recipe.image }}:test
      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          ignore-unfixed: true
          image-ref: images-${{ matrix.recipe.image }}:test
          scanners: vuln
          severity: CRITICAL,HIGH
          timeout: 20m
      - name: Log In to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: publish
        name: Publish Verified Image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          build-args: |
            UPSTREAM_REFERENCE=${{ matrix.recipe.reference }}
            UPSTREAM_REVISION=${{ matrix.recipe.revision }}
          build-contexts: upstream=https://github.com/${{ matrix.recipe.repository }}.git#${{ matrix.recipe.revision }}
          context: ./${{ matrix.recipe.image }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/${{ matrix.architecture }}
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Record Digest
        if: steps.publish.outcome == 'success'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$IMAGE_DIGEST" > "digests/$ARCHITECTURE"
      - name: Upload Digest
        if: steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.recipe.image }}-${{ matrix.architecture }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.recipe.image }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.prepare.outputs.matrix).include }}
    steps:
      - name: Download Digests
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: digests
          pattern: digests-${{ matrix.recipe.image }}-*
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Multi-Architecture Manifest
        env:
          ARCHITECTURES: ${{ join(matrix.recipe.architectures, ' ') }}
          BUILD_REVISION: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/maxexcloo/${{ matrix.recipe.image }}
          UPSTREAM_REVISION: ${{ matrix.recipe.revision }}
        run: |
          set --
          for architecture in $ARCHITECTURES; do
            digest=$(cat "digests/$architecture")
            set -- "$@" "$IMAGE_NAME@$digest"
          done
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:sha-$BUILD_REVISION" \
            --tag "$IMAGE_NAME:source-$UPSTREAM_REVISION" \
            "$@"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$BUILD_REVISION"
