# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ComfyUI fsspec
pipelineid: update-comfyui-fsspec
labels:
  group: packages
sources:
  version:
    kind: pypi
    spec:
      name: fsspec
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: comfyui-rocm/Dockerfile
      matchpattern: (fsspec==)[0-9.]+
      replacepattern: ${1}{{ source "version" }}
