# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Versioned Actions
pipelineid: update-versioned-actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      credentials:
        github.com:
          token: '{{ env "GITHUB_TOKEN" }}'
          kind: github
      only:
        - actions:
            aquasecurity/trivy-action: ""
      versionfilter:
        kind: semver
        pattern: "*"
      rootdir: .github
labels:
  group: actions
