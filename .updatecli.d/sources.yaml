# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Tailscale Source
pipelineid: update-tailscale-source
labels:
  group: sources
sources:
  revision:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/tailscale/tailscale.git refs/tags/{{ source "version" }} refs/tags/{{ source "version" }}'^{}' | tail -n 1 | cut -f 1)
        test -n "$revision"
        printf '%s\n' "$revision"
  version:
    kind: githubrelease
    spec:
      owner: tailscale
      repository: tailscale
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  reference:
    kind: file
    sourceid: version
    spec:
      file: gatus-tailscale/Dockerfile
      matchpattern: (?m)(ARG TAILSCALE_REFERENCE=)[^\s]+
      replacepattern: ${1}{{ source "version" }}
  revision:
    kind: file
    sourceid: revision
    spec:
      file: gatus-tailscale/Dockerfile
      matchpattern: (?m)(ARG TAILSCALE_REVISION=)[a-f0-9]{40}
      replacepattern: ${1}{{ source "revision" }}
---
name: Update atvloadly Source
pipelineid: update-atvloadly-source
labels:
  group: sources
sources:
  release:
    kind: githubrelease
    spec:
      owner: bitxeno
      repository: atvloadly
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
  repository:
    kind: json
    spec:
      engine: dasel/v3
      file: atvloadly/source.json
      key: repository
  revision:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/{{ source "repository" }}.git refs/tags/{{ source "release" }} refs/tags/{{ source "release" }}'^{}' | tail -n 1 | cut -f 1)
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  reference:
    kind: json
    sourceid: release
    spec:
      engine: dasel/v3
      file: atvloadly/source.json
      key: reference
  revision:
    kind: json
    sourceid: revision
    spec:
      engine: dasel/v3
      file: atvloadly/source.json
      key: revision
---
name: Update betterbench Source
pipelineid: update-betterbench-source
labels:
  group: sources
sources:
  repository:
    kind: json
    spec:
      engine: dasel/v3
      file: betterbench/source.json
      key: repository
  revision:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/{{ source "repository" }}.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  revision:
    kind: json
    sourceid: revision
    spec:
      engine: dasel/v3
      file: betterbench/source.json
      key: revision
