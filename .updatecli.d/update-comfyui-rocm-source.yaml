# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update comfyui-rocm Source
pipelineid: update-comfyui-rocm-source
labels:
  group: sources
sources:
  reference:
    kind: json
    spec:
      file: comfyui-rocm/source.json
      key: reference
      engine: dasel/v3
  release:
    kind: githubrelease
    spec:
      owner: Comfy-Org
      repository: ComfyUI
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
  repository:
    kind: json
    spec:
      file: comfyui-rocm/source.json
      key: repository
      engine: dasel/v3
  revision:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/{{ source "repository" }}.git refs/tags/{{ source "release" }} refs/tags/{{ source "release" }}'^{}' | tail -n 1 | cut -f 1)
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  reference:
    kind: json
    sourceid: release
    spec:
      file: comfyui-rocm/source.json
      key: reference
      engine: dasel/v3
  revision:
    kind: json
    sourceid: revision
    spec:
      file: comfyui-rocm/source.json
      key: revision
      engine: dasel/v3
