# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Tailscale Source
pipelineid: update-tailscale-source
labels:
  group: sources
sources:
  revision:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/tailscale/tailscale.git refs/tags/{{ source "version" }} refs/tags/{{ source "version" }}'^{}' | tail -n 1 | cut -f 1)
        test -n "$revision"
        printf '%s\n' "$revision"
  version:
    kind: githubrelease
    spec:
      owner: tailscale
      repository: tailscale
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  reference:
    kind: file
    sourceid: version
    spec:
      file: gatus-tailscale/Dockerfile
      matchpattern: (?m)(ARG TAILSCALE_REFERENCE=)[^\s]+
      replacepattern: ${1}{{ source "version" }}
  revision:
    kind: file
    sourceid: revision
    spec:
      file: gatus-tailscale/Dockerfile
      matchpattern: (?m)(ARG TAILSCALE_REVISION=)[a-f0-9]{40}
      replacepattern: ${1}{{ source "revision" }}
