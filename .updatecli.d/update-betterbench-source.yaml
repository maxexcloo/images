# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update betterbench Source
pipelineid: update-betterbench-source
labels:
  group: sources
sources:
  reference:
    kind: json
    spec:
      file: betterbench/source.json
      key: reference
      engine: dasel/v3
  repository:
    kind: json
    spec:
      file: betterbench/source.json
      key: repository
      engine: dasel/v3
  revision:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/GGZ14/BetterBench.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  revision:
    kind: json
    sourceid: revision
    spec:
      file: betterbench/source.json
      key: revision
      engine: dasel/v3
