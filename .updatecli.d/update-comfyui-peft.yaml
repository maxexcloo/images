# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ComfyUI peft
pipelineid: update-comfyui-peft
labels:
  group: packages
sources:
  version:
    kind: pypi
    spec:
      name: peft
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: comfyui-rocm/Dockerfile
      matchpattern: (peft==)[0-9.]+
      replacepattern: ${1}{{ source "version" }}
